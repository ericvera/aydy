name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Must run before setup-node so that `yarn --version` reports the pinned
      # Yarn 4 and the cache step resolves the right cache directory.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn build-tsc

      - name: Lint
        # Type-aware linting with projectService runs out of heap on the
        # default Node limit.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
